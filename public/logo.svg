<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="wdsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ballShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon: Modern Geometric Soccer Ball -->
  <g transform="translate(42, 40)">
    <!-- Ball Base Shell -->
    <circle cx="0" cy="0" r="28" fill="url(#ballShine)" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Central Pentagon -->
    <polygon points="0,-7 7,-2 4,6 -4,6 -7,-2" fill="#0f172a" />
    
    <!-- Connecting Seams -->
    <line x1="0" y1="-7" x2="0" y2="-17" stroke="#0f172a" stroke-width="2" />
    <line x1="7" y1="-2" x2="16" y2="-5" stroke="#0f172a" stroke-width="2" />
    <line x1="4" y1="6" x2="10" y2="15" stroke="#0f172a" stroke-width="2" />
    <line x1="-4" y1="6" x2="-10" y2="15" stroke="#0f172a" stroke-width="2" />
    <line x1="-7" y1="-2" x2="-16" y2="-5" stroke="#0f172a" stroke-width="2" />
    
    <!-- Outer Facets -->
    <polygon points="0,-17 -7,-23 -14,-17 -7,-12" fill="#334155" />
    <polygon points="0,-17 7,-23 14,-17 7,-12" fill="#334155" />
    <polygon points="16,-5 24,-10 26,-2 20,4" fill="#334155" />
    <polygon points="-16,-5 -24,-10 -26,-2 -20,4" fill="#334155" />
    <polygon points="10,15 17,15 15,24 7,23" fill="#334155" />
    <polygon points="-10,15 -17,15 -15,24 -7,23" fill="#334155" />

    <!-- Orbital Ring Node -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- Wordmark Text -->
  <text x="86" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-1.2">
    <tspan fill="#0f172a">Watch</tspan>
    <tspan fill="url(#wdsGrad)">WDS</tspan>
  </text>
</svg>
